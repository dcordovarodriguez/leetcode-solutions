name: Verify README

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify generated README is current
        run: python3 scripts/update_readme.py --check
